<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="moonseal">
  <title>moonseal</title>
  <defs>
    <radialGradient id="ms-lit" cx="0.62" cy="0.36" r="0.78">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#e3e3e8"/>
      <stop offset="0.82" stop-color="#9b9ba5"/>
      <stop offset="1" stop-color="#5d5d66"/>
    </radialGradient>
    <linearGradient id="ms-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dffb0"/>
      <stop offset="0.55" stop-color="#5eb1ff"/>
      <stop offset="1" stop-color="#7dffb0"/>
    </linearGradient>
    <radialGradient id="ms-earth" cx="0.35" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#b9e2ff"/>
      <stop offset="0.5" stop-color="#3d8bff"/>
      <stop offset="1" stop-color="#0d2a66"/>
    </radialGradient>
    <radialGradient id="ms-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7dffb0" stop-opacity="1"/>
      <stop offset="1" stop-color="#7dffb0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ms-lattice" width="3.2" height="2.77" patternUnits="userSpaceOnUse">
      <circle cx="0.8" cy="0.7" r="0.42" fill="#7dffb0"/>
      <circle cx="2.4" cy="2.08" r="0.42" fill="#7dffb0"/>
    </pattern>
    <clipPath id="ms-disk"><circle cx="32" cy="32" r="22"/></clipPath>
  </defs>
  <!-- seal edge: 60 ticks, like a wax seal / coin; the lattice ring of post-quantum crypto -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="url(#ms-ring)" stroke-width="2.4" stroke-dasharray="0.62 0.9906" opacity="0.95"/>
  <circle cx="32" cy="32" r="25.4" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="0.6"/>
  <!-- night side with a faint lattice -->
  <circle cx="32" cy="32" r="22" fill="#07080c"/>
  <g clip-path="url(#ms-disk)" opacity="0.38"><rect x="8" y="8" width="48" height="48" fill="url(#ms-lattice)"/></g>
  <!-- lit side: right half + an elliptical terminator bulging into the night (a crescent: the night side carries the lattice) -->
  <path d="M32 10 A22 22 0 1 1 32 54 A9.5 22 0 1 0 32 10 Z" fill="url(#ms-lit)"/>
  <!-- crater hints on the lit side -->
  <g fill="#000" fill-opacity="0.10">
    <circle cx="42" cy="22" r="2.6"/><circle cx="47" cy="33" r="1.7"/><circle cx="38.5" cy="38" r="2.1"/>
    <circle cx="44" cy="44.5" r="1.3"/><circle cx="36" cy="17.5" r="1.1"/>
  </g>
  <!-- the landing site: the south pole, which always sits on the terminator -->
  <circle cx="32" cy="53.4" r="5" fill="url(#ms-glow)"/>
  <circle cx="32" cy="53.4" r="1.6" fill="#7dffb0"/>
  <circle cx="32" cy="53.4" r="0.7" fill="#ffffff"/>
  <!-- Earth on the horizon, just past the limb -->
  <circle cx="51.6" cy="46.6" r="4.6" fill="#000"/>
  <circle cx="51.6" cy="46.6" r="3.6" fill="url(#ms-earth)"/>
</svg>
